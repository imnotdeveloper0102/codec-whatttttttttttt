[workspace]
members = [
    "crates/codec-whatttttttttttt-core",
    "crates/codec-whatttttttttttt-cli",
    "crates/codec-whatttttttttttt-c",
    "crates/codec-whatttttttttttt-wasm",
]
# The fuzz crate is built by cargo-fuzz with its own flags, not by
# the workspace; excluding it keeps `cargo test --workspace` from
# touching it.
exclude = ["crates/codec-whatttttttttttt-core/fuzz"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["codec-whatttttttttttt contributors"]
rust-version = "1.75"

[workspace.dependencies]
thiserror = "2"
clap = { version = "4", features = ["derive"] }
proptest = "1"
