[package]
name = "codec-whatttttttttttt-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Core codec library: PCM/WAV, FLAC, Opus, Vorbis, AV1, VP9 (open formats only)"
repository = "https://example.invalid/codec-whatttttttttttt"

[dependencies]
thiserror.workspace = true

# License gates for patent-encumbered codecs. All off by default:
# building with them only compiles the hardware path behind the
# gate; it never enables a software encoder or decoder for these
# codecs, and a valid `LicenseContext` is still required at runtime.
[features]
default = []
licensed-avc-hevc = []
licensed-aac = []

[dev-dependencies]
proptest.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
